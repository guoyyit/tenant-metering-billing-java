# Local tenant metering & billing configuration.
# Directory that holds the durable write-ahead log (events.log + events.log.lock).
metering.data-dir=data
# Write-ahead log file name inside metering.data-dir.
metering.log-file=events.log
# Settlement cycle used when a tenant is auto-provisioned: DAILY | WEEKLY | MONTHLY.
metering.default-cycle=MONTHLY
# Policy for records that miss their target period's writable window:
# REJECT | CURRENT_PERIOD | NEAREST_WRITABLE_PERIOD.
metering.default-late-policy=NEAREST_WRITABLE_PERIOD
# How long an elapsed-but-not-closed period still accepts records (milliseconds).
# Default: 7 days.
metering.default-late-window-millis=604800000
